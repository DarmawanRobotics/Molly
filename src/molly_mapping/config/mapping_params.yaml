grid_mapper_node:
  ros__parameters:
    cloud_topic: /cloud_registered_body   # FAST-LIO deskewed scan in `body`
    map_frame: map
    base_frame: base_link
    resolution: 0.05                  # m per cell
    initial_size_m: 20.0              # first grid, grows by grow_m when the robot gets near an edge
    grow_m: 5.0
    rate_hz: 2.0                      # scans integrated per second (the newest one each time)
    publish_hz: 1.0                   # mapping/grid while mapping
    voxel: 0.05                       # m, downsampling of each scan
    # Obstacle band relative to base_link's height, measured in the (gravity aligned) map frame:
    # base_link is ~0.30 m above the floor on a standing Lite3, so -0.25 keeps anything taller
    # than ~5 cm and drops the floor; 1.2 drops the ceiling.
    obstacle_z_min: -0.25
    obstacle_z_max: 1.2
    self_filter_x_min: -0.40          # the robot's own body and legs in base_link, ignored
    self_filter_x_max: 0.40
    self_filter_y_min: -0.28
    self_filter_y_max: 0.28
    min_range: 0.3                    # m from the sensor
    max_range: 15.0                   # m, hits and free space beyond are ignored
    angular_bins: 720                 # free space is carved to the nearest hit of each bin
    log_odds_hit: 0.85                # added per scan to a cell with a hit
    log_odds_miss: -0.4               # added per scan to a cell a ray crosses
    log_odds_min: -2.0
    log_odds_max: 3.5
    occupied_threshold: 0.65          # probability above which a cell is occupied
    free_threshold: 0.35              # probability below which a cell is free (2 crossings)
    save_margin_m: 1.0                # unknown border kept around the mapped area when saving
    max_cloud_age_sec: 1.0            # scans without a transform for this long are dropped

site_manager_node:
  ros__parameters:
    sites_dir: ~/dev/Molly/map        # one directory per site: map, tags, POIs, tours, routes
    site: ""                          # site loaded at start; empty: the one of the last run
    state_file: ~/.molly/site         # remembers the active site
    map_frame: map
    base_frame: base_link
    service_timeout_sec: 5.0          # waiting for localization and the grid mapper
    refresh_sec: 2.0                  # site/status refresh (tags recorded, sites added)
    start_mapping: false              # true (mode:=mapping): map `site` at start when it is new
