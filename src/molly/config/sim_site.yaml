# Site configuration for the simulator (molly_sim/sim.launch.py): the stack reads the simulated
# body-frame cloud, speaks silently and writes nothing into the real map/ or ~/.molly.
control_mux_node:
  ros__parameters:
    field_in_remote: true             # off on robots by default; the sim tests the option

lidar_sector_node:
  ros__parameters:
    input_type: pointcloud2
    pointcloud_topic: /cloud_registered_body

localization_node:
  ros__parameters:
    auto_localize_on_start: false     # no AprilTags in the sim: molly_sim sends /initialpose

path_loader_node:
  ros__parameters:
    route_state_file: /tmp/molly_sim/last_route

path_follower_node:
  ros__parameters:
    inspection_services: ["/sim/inspect"]   # stop-point hook: sim_robot_node answers "clear"
    approach_timeout_sec: 10.0

route_recorder_node:
  ros__parameters:
    output_path: /tmp/molly_sim/routes/

teleop_udp_node:
  ros__parameters:
    token: sim

site_manager_node:
  ros__parameters:
    state_file: /tmp/molly_sim/site

visitor_tracker_node:
  ros__parameters:
    input_type: pointcloud2
    pointcloud_topic: /cloud_registered_body

guide_node:
  ros__parameters:
    wait_for_visitors: false          # nobody follows the simulated robot

speech_node:
  ros__parameters:
    engine: none                      # silent; "speaking" takes text length / none_chars_per_sec
    none_chars_per_sec: 200.0

interaction_node:
  ros__parameters:
    state_file: /tmp/molly_sim/greeter.json

health_monitor_node:
  ros__parameters:
    topics:
      - /cloud_registered_body:5.0
      - /perception/sector_scan:5.0
      - /perception/safety_scan:5.0
      - /{robot_ns}/odom:10.0
      - /Odometry:8.0
