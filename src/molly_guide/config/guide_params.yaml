guide_node:
  ros__parameters:
    # Language of the guide's own texts (POI narrations carry their own language)
    language: id
    # Said at the start and the end of a tour and when nobody follows; language:text, "" none
    intro_texts:
      - "id:Halo semuanya, saya Molly. Mari ikuti saya, kita mulai turnya."
      - "en:Hello everyone, I am Molly. Please follow me, let's start the tour."
    outro_texts:
      - "id:Turnya sudah selesai. Terima kasih sudah berkeliling bersama saya!"
      - "en:That is the end of the tour. Thank you for walking with me!"
    follow_me_texts:
      - "id:Ayo, ikuti saya ya."
      - "en:Please follow me."
    gestures: true                    # play the POI gestures (interaction/gesture)
    narrate: true                     # say the POI narrations and the guide's texts
    # Walking to a POI (planner/go_to, then planner/status arrived)
    arrival_timeout_sec: 300.0        # walking time (waits for visitors excluded)
    go_to_retries: 1                  # tries after a failed walk
    retry_delay_sec: 3.0
    on_failure: skip                  # skip: go on with the next POI | stop: tour in ERROR
    gesture_timeout_sec: 25.0
    # Narration time limit: base + characters / chars_per_sec, then the tour goes on anyway
    narration_timeout_base_sec: 15.0
    narration_chars_per_sec: 8.0
    # Followers (perception/visitors.behind): nobody behind for visitor_lost_sec while walking
    # holds the walk (navigation/pause) and asks the visitors to follow; the walk goes on once
    # somebody is behind for visitor_found_sec, or after visitor_wait_sec (then not again on
    # this leg). Off without fresh visitor data or while the handheld drives (REMOTE).
    wait_for_visitors: true
    visitor_lost_sec: 6.0
    visitor_found_sec: 1.0
    visitor_wait_sec: 20.0
    visitors_timeout_sec: 2.0
    # START needs a localized robot in AUTO
    require_localization: true
    require_auto_mode: true
    tick_hz: 10.0
    publish_period_sec: 1.0           # /tour/state also without a change
