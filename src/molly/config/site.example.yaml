# Per-robot site configuration: script/setup.sh install config copies it to
# /etc/molly/site.yaml (SITE_CONFIG in the env file); edit it there, then restart the service.
# A normal ROS 2 parameter file keyed by node name, applied on top of every package default, so
# tuning for one site or one robot never needs a change in the repository. Unknown node names are
# reported at start; a broken file stops the launch. Values below are for a Deep Robotics Lite3
# (body 0.548 x 0.370 m, base_link ~0.30 m above the floor standing): measure yours
# (src/xtras/README.md, "Per-robot parameters").

# ---------------------------------------------------------------- this robot

control_mux_node:
  ros__parameters:
    field.front: 0.34                 # m, base_link to the front edge of the body
    field.rear: 0.34
    field.half_width: 0.22
    field.max_decel: 0.6              # m/s^2, MEASURE: braking from full speed on this floor
    field.reaction_time: 0.25         # s, command to the robot actually braking
    max_vx: 1.0                       # m/s, nothing may command more (the Lite3 takes 1.0)
    max_vy: 0.5                       # the Lite3 strafes up to 0.5 m/s
    max_wz: 1.5                       # rad/s

path_follower_node:
  ros__parameters:
    holonomic: true                   # false if the robot cannot strafe
    target_linear_velocity: 0.35      # m/s, walking speed with visitors behind
    footprint.front: 0.34
    footprint.rear: 0.34
    footprint.half_width: 0.22
    low_battery_percentage: 0.25

planner_node:
  ros__parameters:
    robot_radius: 0.35                # m, half the body diagonal plus a margin
    inflation_radius: 0.70            # m, paths keep away from walls up to here

lidar_sector_node:
  ros__parameters:
    obstacle_z_min: -0.20             # -(height of base_link above the floor) + 0.10
    self_filter_x_min: -0.36          # the robot's own body and legs, ignored
    self_filter_x_max: 0.36
    self_filter_y_min: -0.22
    self_filter_y_max: 0.22

visitor_tracker_node:
  ros__parameters:
    z_min: -0.15                      # legs and torso, relative to base_link

teleop_udp_node:
  ros__parameters:
    token: "change-me"                # shared secret, the same in the handheld app settings
    max_vx: 1.0
    max_vy: 0.5
    max_wz: 1.5
    # The handheld's action menu: std_srvs/Trigger services of the robot driver (/<ROBOT_NS>/<name>)
    robot_commands: [stand_up, sit_down, gait_slow, gait_medium, emergency_stop]

interaction_node:
  ros__parameters:
    gestures: [hello, nod, bow, look_left, look_right]    # the Lite3 driver's gesture services

# speech_node:
#   ros__parameters:
#     audio_device: "plughw:CARD=Device,DEV=0"   # a USB speaker (aplay -L)

# video_stream_node:                  # the handheld's WebRTC video (MediaMTX)
#   ros__parameters:
#     bitrate_kbps: 800               # weak Wi-Fi: lower it
#     fps: 10.0

# ---------------------------------------------------------------- this site

obstacle_avoidance_node:
  ros__parameters:
    emergency_distance: 0.65          # m from base_link, hard stop in the front cone

localization_node:
  ros__parameters:
    tag_frames: [tag_0, tag_1, tag_2, tag_3]     # apriltag tag.frames of this site

apriltag:
  ros__parameters:
    tag:
      ids: [0, 1, 2, 3]
      frames: [tag_0, tag_1, tag_2, tag_3]
      sizes: [0.16, 0.16, 0.16, 0.16]

guide_node:
  ros__parameters:
    language: id                      # the guide's own texts: intro, outro, follow me

