# molly_bridge defaults: only notes, the values are the dataclass defaults
# (molly_bridge/core/config.py); `ros2 param describe /teleop_udp_node <name>` shows units and
# ranges. Joystick limits come from the robot profile (robot.limits); the control mux decides
# who drives (the bringup's stack.yaml, control_mux_node).
teleop_udp_node:
  ros__parameters:
    token: "" # shared secret, the same in the handheld app; set it in the site file
    remote_source: handheld # control/remote/handheld/cmd_vel (a remote_sources entry of the mux)
    # The handheld's action menu: std_srvs/Trigger services of the driver (/<robot_ns>/<name>)
    robot_commands: [stand_up, sit_down, emergency_stop]
    camera_topic: /camera/camera/color/image_raw/compressed
    camera_compressed: true # false: raw rgb8 / bgr8 Image, JPEG-encoded here (OpenCV)

# H.264 for the handheld's WebRTC video. MediaMTX (bridge.launch.py) starts this node while the
# handheld watches and stops it after; it publishes to MediaMTX over RTSP on the loopback.
video_stream_node:
  ros__parameters:
    image_topic: /camera/camera/color/image_raw # raw rgb8 / bgr8 / mono8 / yuv422 image
    encoder: auto # the first that works of nvv4l2h264enc (Jetson), x264enc, openh264enc
