name: docs

# The documentation site (docs/site, VitePress) from the repository's Markdown: built on every
# pull request that touches the docs, published to GitHub Pages from main once Pages is enabled
# (Settings -> Pages -> Source: GitHub Actions); until then the build only reports it.

on:
  push:
    branches: [main]
    paths: ["**.md", "docs/**", "src/**/config/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**.md", "docs/**", "src/**/config/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Python for generated pages
        if: hashFiles('docs/site/requirements.txt') != ''
        run: pip install -r docs/site/requirements.txt
      - name: GitHub Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true # not enabled yet: build only
        uses: actions/configure-pages@v5
      - name: Build the site
        working-directory: docs/site
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || format('/{0}/', github.event.repository.name) }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Pages not enabled
        if: steps.pages.outcome == 'failure'
        run: echo "::notice title=GitHub Pages::not enabled, the site was built but not published (Settings -> Pages -> Source -> GitHub Actions)"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
