health_monitor_node:
  ros__parameters:
    robot_ns: robot                   # fills {robot_ns} in topics (robot.launch.py sets it)
    topics:                           # "topic:minimum Hz"; below 80 % of it is an issue
      - /livox/lidar:5.0
      - /Odometry:8.0
      - /perception/sector_scan:5.0
      - /camera/camera/color/camera_info:5.0   # not the JPEG topic: that would make the driver encode every frame
      - /{robot_ns}/odom:10.0
    max_cpu_temp_c: 85.0
    max_memory_percent: 92.0
    min_disk_free_gb: 5.0
    disk_path: "~"
    publish_hz: 1.0
    expected_nodes: [""]              # node names that must be running (robot.launch.py fills it)
    startup_grace_sec: 30.0           # no missing-node issues during start-up
    diagnostics_topic: molly/diagnostics
    status_prefix: molly
