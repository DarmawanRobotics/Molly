# molly_interaction defaults: only notes, the values are the dataclass defaults
# (molly_interaction/core/config.py); `ros2 param describe /<node> <name>` shows units and
# ranges. The robot (frames, footprint, base_height) comes from the robot profile.
speech_node:
  ros__parameters:
    # auto: Piper when its binary and the language's voice exist (script/setup.sh install
    # speech), else eSpeak NG, else none (silent, for the simulator).
    engine: auto
    audio_device: "" # aplay -L, e.g. "plughw:CARD=Device,DEV=0" for a USB speaker

interaction_node:
  ros__parameters:
    # The driver's gesture services (std_srvs/Trigger /<robot_ns>/<name>); the Lite3 driver's
    # wait until the gesture is done and refuse while it walks.
    gestures: [hello, nod, bow, look_left, look_right]
    greeting_gesture: "" # e.g. nod; "hello" sits the Lite3 down first

conversation_node:
  ros__parameters:
    model: qwen2.5:3b # any chat model pulled into the Ollama service

visitor_tracker_node:
  ros__parameters:
    # livox: Livox CustomMsg on /livox/lidar (raw, ~1 ms per scan); pointcloud2: e.g. FAST-LIO's
    # /cloud_registered_body, which has FAST-LIO's blind radius cut out.
    input_type: livox
