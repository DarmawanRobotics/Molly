name: molly
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: molly-dev:humble
    container_name: molly-dev
    hostname: molly-dev
    init: true
    stdin_open: true
    tty: true
    shm_size: 1gb
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-molly}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ports:
      - "127.0.0.1:5901:5901"   # VNC (macOS: vnc://localhost:5901)
      - "127.0.0.1:6080:6080"   # noVNC (http://localhost:6080/vnc.html)
    volumes:
      - .:/home/robot/dev/Molly
      # build artefacts stay in fast Linux volumes instead of the macOS bind mount
      - build:/home/robot/dev/Molly/build
      - install:/home/robot/dev/Molly/install
      - log:/home/robot/dev/Molly/log

volumes:
  build:
  install:
  log:
