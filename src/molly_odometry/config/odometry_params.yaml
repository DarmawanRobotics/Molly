odometry_gate:                       # wait_still, the launch prefix of FAST-LIO
  ros__parameters:
    imu_topic: /livox/imu
    still_sec: 2.0                     # this long without motion before FAST-LIO may start
    max_gyro_rad_s: 0.03
    max_acc_rel_std: 0.01              # std of |acc| / mean |acc|, unit-free (Livox reports g)
    max_tilt_deg: 8.0                  # gravity vs Mid-360 z; catches a sitting robot. 0: off
    timeout_sec: 60.0                  # start anyway after this long (with an error). 0: wait forever

odometry_monitor_node:
  ros__parameters:
    odom_topic: /Odometry
    leg_odom_topic: /robot/odom        # robot's own speed for the cross-check, "" to disable
    stale_sec: 0.5                     # FAST-LIO runs at 10 Hz
    max_speed_mps: 3.0                 # faster than this between two frames is a jump
    max_z_drift_m: 0.5                 # flat floor: big z means a tilted start. 0: off
    max_speed_diff_mps: 0.35
    speed_diff_sec: 1.5                # mismatch must last this long (degenerate corridor, slip)
    min_check_speed_mps: 0.1
    restart_origin_radius_m: 0.05
    restart_min_offset_m: 0.3

route_recorder_node:                 # teach: route/record, route/mark_stop_point -> route/saved
  ros__parameters:
    output_path: "/home/robot/dev/Molly/map/"   # writes map/<date>/<time>_path.csv
    map_frame: "map"
    base_frame: "base_link"
    min_waypoint_spacing_m: 0.2
    record_rate_hz: 10.0
