# A small mall: one block of shops in the middle, a 3 m corridor around it, two pillars.
# Map frame, metres. walls: polylines (repeat the first point to close), pillars: [x, y, r].
walls:
  - [[-6.0, -4.5], [6.0, -4.5], [6.0, 4.5], [-6.0, 4.5], [-6.0, -4.5]]   # outer walls
  - [[-3.0, -1.5], [3.0, -1.5], [3.0, 1.5], [-3.0, 1.5], [-3.0, -1.5]]   # shops
pillars:
  - [5.3, 3.8, 0.25]
  - [-5.3, -3.8, 0.25]
  - [0.0, 3.9, 0.2]
start: [-4.5, -3.0, 0.0]          # x, y, yaw_deg: on the patrol loop, facing +x
